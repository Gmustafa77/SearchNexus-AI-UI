<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Gulam Mustafa">
<meta name="color-scheme" content="light dark">
<title>SearchNexus AI · AI search assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--surface:#fff;--surface2:#f0f2fa;--ink:#12142a;--mute:#626883;--line:#dfe2f0;--accent:#4f46e5;--accent2:#0ea5a4;--accent-soft:#e9e8ff;--warn:#8a5a00;--warn-bg:#fff4d6;--err:#b42318;--err-bg:#fde8e6;--ok:#0f8a5f;--shadow:0 1px 2px rgba(18,20,42,.05),0 8px 28px rgba(18,20,42,.07);
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=dark]{--bg:#0c0e1b;--surface:#151830;--surface2:#1c2040;--ink:#eceefb;--mute:#9aa0c3;--line:#272b4d;--accent:#8b8bff;--accent2:#2dd4bf;--accent-soft:#25285a;--warn:#f5c76a;--warn-bg:#3a2e12;--err:#ff8a80;--err-bg:#3d1a1a;--ok:#4ade9f;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0e1b;--surface:#151830;--surface2:#1c2040;--ink:#eceefb;--mute:#9aa0c3;--line:#272b4d;--accent:#8b8bff;--accent2:#2dd4bf;--accent-soft:#25285a;--warn:#f5c76a;--warn-bg:#3a2e12;--err:#ff8a80;--err-bg:#3d1a1a;--ok:#4ade9f;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
background-image:radial-gradient(900px 420px at 85% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(700px 380px at -10% 10%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent);background-repeat:no-repeat}
button{font:inherit;cursor:pointer;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:820px;width:100%;margin:0 auto;padding:16px 20px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.logo svg{width:22px;height:22px}
h1{font:700 21px/1.1 var(--display);margin:0;letter-spacing:-.02em}
.tag{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:3px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.tools{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:7px 12px;font-size:14px;transition:border-color .15s,color .15s,transform .1s}
.btn:hover{border-color:var(--accent);color:var(--ink)}.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.icon{padding:7px 9px}
main{flex:1;overflow-y:auto;padding:8px 20px 24px;scroll-behavior:smooth}
#log{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent2)));color:#fff;border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
:root[data-theme=dark] .user{color:#0c0e1b}
.bot{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:20px 22px;box-shadow:var(--shadow)}
.answer{font-size:16.5px;line-height:1.7}.answer p{margin:0 0 .85em}.answer p:last-child{margin:0}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin:0 2px;vertical-align:2px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 11px var(--sans);text-decoration:none;border:0;transition:background .15s,color .15s}
.cite:hover{background:var(--accent);color:var(--surface)}
h2{font:600 14px var(--display);color:var(--mute);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.points{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.points li{position:relative;padding:9px 12px 9px 34px;background:var(--surface2);border-radius:10px;font-size:15px}
.points li::before{content:"";position:absolute;left:13px;top:15px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.src{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface);transition:border-color .15s,transform .15s,box-shadow .15s;scroll-margin:90px}
.src:hover,.src.hit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.src:hover{transform:translateY(-2px)}
.src img{width:20px;height:20px;border-radius:5px;flex:none;margin-top:2px;background:var(--surface2)}
.src b{display:block;font:600 13.5px/1.35 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src span{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.n{flex:none;font:600 11px var(--sans);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-top:2px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:12px}
.meta{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.ring{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.ring svg{width:30px;height:30px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border-radius:999px;padding:3px 10px}
.spacer{flex:1}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--mute);transition:.15s}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:8px 14px;font-size:14px;text-align:left;transition:background .15s,color .15s,transform .1s}
.chip:hover{background:var(--accent);color:var(--surface)}.chip:active{transform:scale(.97)}
.error{background:var(--err-bg);color:var(--err);border-radius:12px;padding:12px 16px;align-self:stretch;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.error .mini{color:var(--err);border-color:currentColor}
.steps{display:grid;gap:10px;padding:4px 0}
.step{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14.5px;opacity:.45;transition:opacity .3s,color .3s}
.step i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.3s}
.step.on{opacity:1;color:var(--ink)}.step.on i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{opacity:1}.step.done i{background:var(--ok);border-color:var(--ok)}.step.done i::after{content:"";width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes p{0%,80%,100%{opacity:.45}40%{opacity:1}}
.hero{max-width:820px;margin:7vh auto 0;text-align:left}
.hero h2{all:unset;display:block;font:700 clamp(28px,5.5vw,44px)/1.1 var(--display);letter-spacing:-.03em;margin:0 0 12px}
.hero h2::after{content:none}
.hero p{color:var(--mute);font-size:17px;max-width:56ch;margin:0 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.card em{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-style:normal;margin-bottom:10px}
.card em svg{width:17px;height:17px}
.card span{font-size:15px;font-weight:500;line-height:1.4;display:block}
.feats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;color:var(--mute);font-size:13.5px}
.feats span::before{content:"✓ ";color:var(--ok);font-weight:700}
footer{max-width:820px;width:100%;margin:0 auto;padding:6px 20px calc(12px + env(safe-area-inset-bottom))}
#status{min-height:20px;font-size:13px;color:var(--mute);padding:0 6px 6px}
form{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
form:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{flex:1;border:0;outline:0;resize:none;font:inherit;max-height:160px;padding:8px 8px;background:none;color:inherit}
textarea::placeholder{color:var(--mute)}
#send{flex:none;display:grid;place-items:center;width:42px;height:42px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,var(--accent2)));color:#fff;border:0;border-radius:12px;transition:transform .1s,opacity .15s}
:root[data-theme=dark] #send{color:#0c0e1b}
#send svg{width:20px;height:20px}#send:hover{transform:translateY(-1px)}#send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.mic{flex:none;width:42px;height:42px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:12px;color:var(--mute);transition:.15s}
.mic:hover{border-color:var(--accent);color:var(--accent)}
.mic.on{background:var(--err-bg);border-color:var(--err);color:var(--err);animation:p 1.1s infinite ease-in-out}
.mic svg{width:20px;height:20px}
#lang{flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--mute);font:inherit;font-size:13px;height:42px;padding:0 6px;max-width:110px}
.credit{text-align:center;color:var(--mute);font-size:12.5px;margin:10px 0 0}
.credit b{color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:520px){header{padding:12px 14px 6px}main{padding:6px 14px 20px}footer{padding-left:14px;padding-right:14px}.btn .lbl{display:none}.bot{padding:16px}#lang{max-width:78px}.tag{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8.5 11h5M11 8.5v5"/></svg></div>
 <div><h1>SearchNexus AI</h1><div class="tag"><span class="live"></span>Answers from the live web</div></div></div>
 <div class="tools">
  <button class="btn icon" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  <button class="btn" id="new" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New chat</span></button>
 </div>
</header>
<main id="scroller"><div id="log" aria-live="polite"></div></main>
<footer>
 <div id="status" role="status" aria-live="polite"></div>
 <form id="f">
  <textarea id="q" rows="1" maxlength="2000" placeholder="Ask anything, or tap the mic…" aria-label="Your question"></textarea>
  <select id="lang" aria-label="Speech language"><option value="en-IN">English (India)</option><option value="hi-IN">हिन्दी</option><option value="en-US">English (US)</option><option value="ur-IN">اردو</option></select>
  <button id="mic" class="mic" type="button" aria-label="Speak your question" aria-pressed="false" title="Speak your question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button id="send" type="submit" aria-label="Ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
 </form>
 <p class="credit">Developed by <b>Gulam Mustafa</b></p>
</footer>
<script>
const $=s=>document.querySelector(s), log=$("#log"), q=$("#q"), send=$("#send"), scroller=$("#scroller");
let sid=null, busy=false, lastText="";
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ICON={
 code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg>'};
const examples=[["code","What changed in the latest Python release?"],["heart","Is it safe to eat eggs every day, according to recent research?"],["bolt","Explain the current state of fusion energy projects"]];

// theme
const root=document.documentElement;
try{const t=localStorage.getItem("sn-theme");if(t)root.dataset.theme=t}catch(_){}
$("#theme").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("sn-theme",root.dataset.theme)}catch(_){}};

function empty(){
 const d=el("div","hero");d.append(el("h2",null,"Ask. Search. Verify."),
  el("p",null,"I search the web, cross-check the sources against each other, and show you exactly where every claim came from."));
 const c=el("div","cards");
 examples.forEach(([ic,t])=>{const b=el("button","card");const i=el("em");i.innerHTML=ICON[ic];b.append(i,el("span",null,t));b.onclick=()=>ask(t);c.append(b)});
 const f=el("div","feats");["Live web search","Numbered citations","Confidence score","Voice input"].forEach(x=>f.append(el("span",null,x)));
 d.append(c,f);log.append(d)}
const toEnd=()=>scroller.scrollTo({top:scroller.scrollHeight});
const section=(p,t)=>p.append(el("h2",null,t));

// answer text: **bold** and [n] citations
function fill(p,text,hasSrc){
 text.split(/(\[\d+\]|\*\*[^*]+\*\*)/).forEach(part=>{
  if(!part)return;
  let m=part.match(/^\[(\d+)\]$/);
  if(m&&hasSrc){const a=el("a","cite",m[1]);a.href="#src-"+m[1];a.setAttribute("aria-label","Source "+m[1]);
   a.onclick=e=>{e.preventDefault();const s=p.closest(".bot").querySelector("[data-n='"+m[1]+"']");if(s){s.scrollIntoView({behavior:"smooth",block:"center"});s.classList.add("hit");setTimeout(()=>s.classList.remove("hit"),1600)}};p.append(a);return}
  m=part.match(/^\*\*([^*]+)\*\*$/);
  if(m){p.append(el("strong",null,m[1]));return}
  p.append(document.createTextNode(part))})}

function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(_){return u}}

function render(r,question){
 const b=el("div","bot"), a=el("div","answer"), srcs=r.sources||[];
 r.answer.split(/\n{2,}/).forEach(t=>{const p=el("p");fill(p,t.trim(),srcs.length>0);a.append(p)});b.append(a);
 if(r.key_points&&r.key_points.length){section(b,"Key points");const u=el("ul","points");r.key_points.forEach(k=>u.append(el("li",null,k)));b.append(u)}
 if(srcs.length){section(b,"Sources");const g=el("div","srcs");
  srcs.forEach((s,i)=>{const l=el("a","src");l.href=s.url;l.target="_blank";l.rel="noopener noreferrer";l.dataset.n=i+1;l.id="src-"+(i+1);
   const img=el("img");img.alt="";img.loading="lazy";img.src="https://www.google.com/s2/favicons?domain="+encodeURIComponent(host(s.url))+"&sz=64";img.onerror=()=>img.style.visibility="hidden";
   const w=el("div");w.append(el("b",null,s.title),el("span",null,host(s.url)));l.append(el("span","n",i+1),img,w);g.append(l)});b.append(g)}
 (r.warnings||[]).forEach(w=>b.append(el("div","note",w)));
 // meta bar
 const pct=Math.round(r.confidence_score*100),m=el("div","meta"),C=2*Math.PI*12;
 const ring=el("span","ring");ring.title="How well the sources agree";
 ring.innerHTML='<svg viewBox="0 0 30 30"><circle class="bg" cx="15" cy="15" r="12"/><circle class="fg" cx="15" cy="15" r="12" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>';
 ring.append("Confidence "+pct+"%");m.append(ring);
 requestAnimationFrame(()=>requestAnimationFrame(()=>ring.querySelector(".fg").style.strokeDashoffset=C*(1-pct/100)));
 m.append(el("span","pill",r.search_performed?"Searched the web":"Answered without searching"),el("span","pill",(r.latency_ms/1000).toFixed(1)+" s"),el("span","spacer"));
 const cp=el("button","mini","Copy");cp.type="button";
 cp.onclick=async()=>{try{await navigator.clipboard.writeText(r.answer);cp.textContent="Copied"}catch(_){cp.textContent="Copy failed"}setTimeout(()=>cp.textContent="Copy",1500)};
 const rt=el("button","mini","Retry");rt.type="button";rt.onclick=()=>ask(question,true);
 m.append(cp,rt);if(r.summary)m.title=r.summary;b.append(m);
 if(r.follow_up_questions&&r.follow_up_questions.length){const f=el("div","chips");r.follow_up_questions.forEach(x=>{const k=el("button","chip",x);k.onclick=()=>ask(x);f.append(k)});b.append(f)}
 return b}

// staged loading
const STEPS=["Understanding your question","Searching the web","Reading top sources","Cross-checking facts","Writing your answer"];
function loader(){
 const d=el("div","bot"),w=el("div","steps"),rows=STEPS.map(t=>{const s=el("div","step");s.append(el("i"),el("span",null,t));w.append(s);return s});
 d.append(w);let i=0;const go=()=>{rows.forEach((r,k)=>{r.className="step"+(k<i?" done":k===i?" on":"")})};go();
 d.timer=setInterval(()=>{if(i<rows.length-1){i++;go()}},2200);return d}

async function ask(text,retry){
 text=text.trim();if(!text||busy)return;if(listening)rec.abort();say("");busy=true;send.disabled=true;lastText=text;
 if(log.querySelector(".hero"))log.innerHTML="";
 if(!retry)log.append(el("div","user",text));
 q.value="";q.style.height="auto";
 const ld=loader();log.append(ld);toEnd();
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),90000);
 try{
  const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,session_id:sid}),signal:ctl.signal});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error?.message||"Request failed ("+res.status+").");
  sid=data.session_id;clearInterval(ld.timer);ld.replaceWith(render(data,text));
 }catch(e){clearInterval(ld.timer);
  const er=el("div","error");er.append(el("span",null,e.name==="AbortError"?"The request timed out. Check your connection and try again.":e.message||"Network error. Check your connection and try again."));
  const rb=el("button","mini","Try again");rb.type="button";rb.onclick=()=>{er.remove();ask(text,true)};er.append(rb);ld.replaceWith(er)}
 finally{busy=false;send.disabled=false;q.focus();toEnd()}
}

// ---- speech to text (browser Web Speech API) ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=$("#mic"), lang=$("#lang"), statusEl=$("#status");
let rec=null, listening=false, base="";
const say=m=>{statusEl.textContent=m};
const MIC_ERR={"not-allowed":"Microphone access is blocked. Allow it in your browser's site settings.","service-not-allowed":"Speech recognition is not allowed here.","no-speech":"I didn't hear anything. Tap the mic and try again.","audio-capture":"No microphone was found.","network":"The speech service could not be reached.","language-not-supported":"That language is not supported by this browser."};
if(!SR){mic.hidden=true;lang.hidden=true}
mic.onclick=()=>{
 if(listening){rec.stop();return}
 if(busy)return;
 rec=new SR();rec.lang=lang.value;rec.interimResults=true;rec.continuous=false;
 base=q.value.trim()?q.value.trim()+" ":"";
 rec.onstart=()=>{listening=true;mic.classList.add("on");mic.setAttribute("aria-pressed","true");say("Listening… speak now")};
 rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;q.value=base+t;q.oninput()};
 rec.onerror=e=>{if(e.error!=="aborted")say(MIC_ERR[e.error]||"Speech recognition error: "+e.error)};
 rec.onend=()=>{listening=false;mic.classList.remove("on");mic.setAttribute("aria-pressed","false");if(statusEl.textContent.startsWith("Listening"))say("");q.focus()};
 try{rec.start()}catch(_){say("Could not start the microphone.")}
};

$("#f").onsubmit=e=>{e.preventDefault();ask(q.value)};
q.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(q.value)}};
q.oninput=()=>{q.style.height="auto";q.style.height=q.scrollHeight+"px"};
$("#new").onclick=()=>{if(sid)fetch("/api/sessions/"+sid,{method:"DELETE"}).catch(()=>{});sid=null;log.innerHTML="";empty()};
empty();
</script>
</body>
</html>
